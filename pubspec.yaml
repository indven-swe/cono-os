name: cono_os
description: ConoOS, an open-source operating-system experience inside your existing OS.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  flutter_inappwebview: ^6.1.5
  flutter_onnxruntime: ^1.9.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
