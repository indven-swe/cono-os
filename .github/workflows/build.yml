name: Build Cono OS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a Release with the builds"
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  verify:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Generate brand icons
        run: |
          dart run tool/make_icon.dart
          dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/make_icon.dart
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/cono_os.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected Windows app executable at $exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = $env:GITHUB_REF_NAME
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/Cono-OS-$v-windows-x64.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/make_icon.dart
      - run: dart run flutter_launcher_icons
      - run: flutter build macos --release
      - name: Ad-hoc sign and zip
        run: |
          mkdir -p dist
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "dist/Cono-OS-${GITHUB_REF_NAME}-macos.zip"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  ios:
    name: iOS (unsigned IPA)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/make_icon.dart
      - run: dart run flutter_launcher_icons
      - name: Build without code signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP" Payload/
          zip -qry "dist/Cono-OS-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  linux:
    name: Linux
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/make_icon.dart
      - run: dart run flutter_launcher_icons
      - run: flutter build linux --release
      - name: Archive bundle
        run: |
          mkdir -p dist
          tar -czf "dist/Cono-OS-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    name: Publish Release
    needs: [windows, macos, ios, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Cono-OS-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cono OS ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
